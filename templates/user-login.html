<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Sapienta</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet" />
  <style media="screen">
    *,
    *:before,
    *:after {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      background-image: url("static\\assets-home\\images\\banner2.jpg");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      margin: 0;
      padding: 0;
      height: 100vh;
    }

    .background {
      width: 430px;
      height: 520px;
      position: absolute;
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
    }

    .background .shape {
      height: 200px;
      width: 200px;
      position: absolute;
      border-radius: 50%;
      background-color: white;
      /* Change circle color here */
    }

    .shape:first-child {
      left: -80px;
      top: -80px;
    }

    .shape:last-child {
      right: -30px;
      bottom: -80px;
      background-color: #ff007f;
      /* Change circle color here */
    }

    form {
      height: 520px;
      width: 400px;
      background-color: rgba(148, 4, 122, 0.6);
      position: absolute;
      transform: translate(-50%, -50%);
      top: 50%;
      left: 50%;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(0, 0, 0, 0);
      box-shadow: 0 0 40px rgba(8, 7, 16, 0.6);
      padding: 50px 35px;
    }

    form * {
      font-family: "Poppins", sans-serif;
      color: #ffffff;
      letter-spacing: 0.5px;
      outline: none;
      border: none;
    }

    form h3 {
      font-size: 32px;
      font-weight: 500;
      line-height: 42px;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 30px;
      font-size: 16px;
      font-weight: 500;
    }

    input {
      display: block;
      height: 50px;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.07);
      border-radius: 3px;
      padding: 0 10px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 300;
    }

    ::placeholder {
      color: #e5e5e5;
    }

    button {
      margin-top: 50px;
      width: 100%;
      background-color: #ffffff;
      color: #080710;
      padding: 15px 0;
      font-size: 18px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
    }

    .registration-link {
      text-align: center;
      margin-top: 20px;
    }

    .registration-link a {
      color: #fff;
      text-decoration: none;
    }

    .registration-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  <form method="post" action="{{ url_for('user_login') }}">
    <h3>Login</h3>

    <label for="username">Username</label>
    <input type="email" placeholder="Email" name="username" required />

    <label for="password">Password</label>
    <input type="password" placeholder="Password" name="password" required />

    <button>Log In</button>

    <div class="registration-link">
      <p>
        Haven't registered yet?
        <a href="{{ url_for('user_reg') }}">Register now</a>
      </p>
    </div>
  </form>
</body>

</html>
