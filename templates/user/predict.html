{% include "user/header.html" %}

<!-- main content start-->
<div id="page-wrapper" style="min-height: 292px;">
    <div class="main-page">
        <h2 class="title1">Predict</h2>
        <div class="form-grids row widget-shadow" data-example-id="basic-forms">
            <div class="form-title">
                <h4>Select Career Type</h4>
            </div>
            <div class="form-body">
                <form id="career-type-form">
                    <div class="form-group">
                        <select class="form-control" id="career-type" name="career_type">
                            <option value="IT">IT</option>
                            <option value="Non-IT">Non-IT</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-default">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 0;
    }

    #page-wrapper {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .main-page {
        width: 100%;
        max-width: 600px;
        position: relative;
    }

    .title1 {
        color: white;
        font-size: 3rem;
        font-weight: 300;
        text-align: center;
        margin-bottom: 40px;
        text-shadow: 0 4px 8px rgba(0,0,0,0.2);
        position: relative;
    }

    .title1::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 3px;
        background: linear-gradient(90deg, transparent, white, transparent);
        border-radius: 2px;
    }

    .form-grids {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 25px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        overflow: hidden;
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.3);
        position: relative;
    }

    .form-grids::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    }

    .form-title {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 30px 40px;
        color: white;
        position: relative;
        overflow: hidden;
    }

    .form-title::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        0% { left: -100%; }
        100% { left: 100%; }
    }

    .form-title h4 {
        font-size: 1.8rem;
        font-weight: 500;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 15px;
        position: relative;
        z-index: 1;
    }

    .form-title h4::before {
        content: "🎯";
        font-size: 1.5rem;
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-5px); }
        60% { transform: translateY(-3px); }
    }

    .form-body {
        padding: 50px 40px;
        position: relative;
    }

    .form-group {
        margin-bottom: 30px;
        position: relative;
    }

   .form-control {
    width: 100%;
    padding: 20px 25px;
    border: 3px solid #e1e5e9;
    border-radius: 15px;
    font-size: 1.2rem;
    font-family: inherit;
    background: #f8f9fa;
    color: #333; /* Ensure visible text */
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
    cursor: pointer;
    appearance: none;         
    -webkit-appearance: none;  
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
    background-position: right 1.2rem center;
    background-repeat: no-repeat;
    background-size: 16px;
    padding-right: 3rem;
}


    .form-control:hover {
        border-color: #667eea;
        background: white;
        color: #333 !important;;
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.1);
    }

    .form-control:focus {
        border-color: #667eea;
        background: white;
        color: #333;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        transform: translateY(-3px);
    }

    .form-control option {
        padding: 15px;
        font-size: 1.1rem;
        background: white;
        color: #333 !important;
    }

    .form-control option:hover {
        background: #f0f4ff;
    }

    .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 18px 50px;
        border-radius: 50px;
        font-size: 1.2rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        position: relative;
        overflow: hidden;
        display: block;
        margin: 20px auto 0;
        min-width: 180px;
    }

    .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: left 0.6s;
    }

    .btn:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
    }

    .btn:hover::before {
        left: 100%;
    }

    .btn:active {
        transform: translateY(-2px) scale(1.02);
    }

    /* Career type specific styling */
    .career-icons {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-bottom: 30px;
    }

    .career-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        animation: float 3s ease-in-out infinite;
    }

    .career-icon:nth-child(2) {
        animation-delay: 1.5s;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .title1 {
            font-size: 2.5rem;
        }
        
        .form-body {
            padding: 40px 25px;
        }
        
        .form-title {
            padding: 25px 25px;
        }
        
        .form-title h4 {
            font-size: 1.5rem;
        }

        .career-icons {
            gap: 20px;
        }

        .career-icon {
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
        }
    }

    /* Animation for form appearance */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .form-grids {
        animation: fadeInUp 0.8s ease-out;
    }

    .title1 {
        animation: fadeInUp 0.6s ease-out;
    }

    /* Subtle background pattern */
    #page-wrapper::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.1) 0%, transparent 50%),
                          radial-gradient(circle at 75% 75%, rgba(255,255,255,0.1) 0%, transparent 50%);
        pointer-events: none;
    }
</style>

<script>
    document.getElementById('career-type-form').addEventListener('submit', function (event) {
        event.preventDefault();
        var careerType = document.getElementById('career-type').value;
        if (careerType === 'IT') {
            window.location.href = "{{ url_for('predict_IT') }}";
        } else if (careerType === 'Non-IT') {
            window.location.href = "{{ url_for('predict_NONIT') }}";
        }
    });

    // Add visual feedback for selection
    document.getElementById('career-type').addEventListener('change', function() {
        this.style.borderColor = '#667eea';
        this.style.background = 'white';
        
        // Brief animation to show selection
        this.style.transform = 'scale(1.02)';
        setTimeout(() => {
            this.style.transform = 'scale(1)';
        }, 200);
    });
</script>
